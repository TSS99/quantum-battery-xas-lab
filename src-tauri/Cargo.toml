[package]
name = "xas-lab"
version = "1.14.0"
description = "XAS Lab: X-ray absorption spectroscopy and a beamline twin, as a desktop app"
authors = ["Tilock Sadhukhan"]
license = "MIT"
repository = "https://github.com/TSS99/quantum-battery-xas-lab"
edition = "2021"

[lib]
name = "xas_lab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
